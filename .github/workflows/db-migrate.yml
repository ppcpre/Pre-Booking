name: Update database

# Runs new SQL files in supabase/migrations against Supabase whenever they change.
# Needs the repository secret SUPABASE_DB_URL (Supabase → Connect → Session pooler connection string).
on:
  push:
    branches: [main, claude/awesome-goodall-t65b28]
    paths: ["supabase/migrations/**", "scripts/db-migrate.sh", ".github/workflows/db-migrate.yml"]
  workflow_dispatch:

concurrency:
  group: db-migrate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check the secret is set
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Add the repository secret SUPABASE_DB_URL (see docs/SETUP.md, section 6)."
            exit 1
          fi
      - name: Install psql
        run: command -v psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)
      - name: Apply new migrations
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: ./scripts/db-migrate.sh
